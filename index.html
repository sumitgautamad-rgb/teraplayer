<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TeraVideo Clean Player</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0e14;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background: #141822;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #232936;
    }
    .logo {
      font-size: 1rem;
      font-weight: 700;
      color: #7c3aed;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-no-ads {
      background: #059669;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
    }
    .player-container {
      flex: 1;
      width: 100%;
      position: relative;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .footer-bar {
      background: #141822;
      padding: 10px 16px;
      display: flex;
      gap: 10px;
      border-top: 1px solid #232936;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .btn-download {
      background: #2563eb;
      color: #fff;
    }
    .btn-close {
      background: #232936;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">
      <span>▶ TeraVideo</span>
    </div>
    <span class="badge-no-ads">🛡️ 0 Ads • Safe Player</span>
  </div>

  <div class="player-container">
    <iframe 
      id="playerFrame"
      sandbox="allow-scripts allow-same-origin allow-forms"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
      allowfullscreen
    ></iframe>
  </div>

  <div class="footer-bar">
    <a id="downloadBtn" href="#" target="_blank" class="btn btn-download">⬇️ Direct Download</a>
    <button onclick="Telegram.WebApp.close()" class="btn btn-close">✕ Band Karein</button>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    const urlParams = new URLSearchParams(window.location.search);
    const rawUrl = urlParams.get('url');

    if (rawUrl) {
      const encoded = encodeURIComponent(rawUrl);
      document.getElementById('playerFrame').src = 'https://teraplayer.in/?url=' + encoded;
      document.getElementById('downloadBtn').href = 'https://flowvideoplayer.com/?url=' + encoded;
    }
  </script>

</body>
</html>
