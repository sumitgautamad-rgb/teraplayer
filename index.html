<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tbox Ad-Free Player</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #090a0f;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    .header {
      background: #11141e;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e2433;
      flex-shrink: 0;
    }
    .file-meta {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-width: 65vw;
    }
    .file-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f8fafc;
    }
    .file-sub {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 2px;
    }
    .badge-clean {
      background: #059669;
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 9999px;
    }
    .player-box {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      max-height: 100%;
      object-fit: contain;
      outline: none;
    }
    .loader {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #94a3b8;
      font-size: 0.85rem;
      pointer-events: none;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(255, 255, 255, 0.1);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box {
      position: absolute;
      text-align: center;
      padding: 24px;
      display: none;
    }
    .error-box p { color: #ef4444; font-size: 0.9rem; margin-bottom: 12px; }
    .footer {
      background: #11141e;
      padding: 10px 16px;
      display: flex;
      gap: 10px;
      border-top: 1px solid #1e2433;
      flex-shrink: 0;
    }
    .btn {
      flex: 1;
      padding: 11px 16px;
      border-radius: 10px;
      border: none;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-download { background: #7c3aed; color: #ffffff; }
    .btn-close { background: #1e2433; color: #cbd5e1; }
  </style>
</head>
<body>

  <div class="header">
    <div class="file-meta">
      <span class="file-title" id="videoTitle">TeraBox Video</span>
      <span class="file-sub" id="videoSub">Loading...</span>
    </div>
    <span class="badge-clean">🛡️ 100% Ad-Free</span>
  </div>

  <div class="player-box">
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <span>Video load ho raha hai...</span>
    </div>

    <div class="error-box" id="errorBox">
      <p id="errorMsg">Video load karne mein samasya aayi.</p>
      <button class="btn btn-close" onclick="location.reload()">Dobara Koshish Karein</button>
    </div>

    <video id="player" controls playsinline webkit-playsinline autoplay preload="auto">
      Browser HTML5 video support nahi karta.
    </video>
  </div>

  <div class="footer">
    <a id="downloadBtn" href="#" class="btn btn-download" download>
      ⬇️ Download MP4
    </a>
    <button class="btn btn-close" onclick="closePlayer()">
      ✕ Band Karein
    </button>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    function closePlayer() {
      if (window.Telegram && window.Telegram.WebApp) {
        Telegram.WebApp.close();
      } else {
        window.close();
      }
    }

    const params = new URLSearchParams(window.location.search);
    const videoUrl = params.get('v');
    const title = params.get('title') || 'TeraBox Video';
    const size = params.get('size') || '';

    document.getElementById('videoTitle').textContent = title;
    document.getElementById('videoSub').textContent = size ? `${size} • MP4 HD` : 'MP4 HD Video';

    const player = document.getElementById('player');
    const loader = document.getElementById('loader');
    const errorBox = document.getElementById('errorBox');
    const downloadBtn = document.getElementById('downloadBtn');

    if (videoUrl) {
      player.src = videoUrl;
      downloadBtn.href = videoUrl;

      player.addEventListener('loadeddata', () => { loader.style.display = 'none'; });
      player.addEventListener('canplay', () => { loader.style.display = 'none'; });
      player.addEventListener('waiting', () => { loader.style.display = 'flex'; });
      player.addEventListener('playing', () => { loader.style.display = 'none'; });
      player.addEventListener('error', (e) => {
        loader.style.display = 'none';
        errorBox.style.display = 'block';
      });
    } else {
      loader.style.display = 'none';
      errorBox.style.display = 'block';
      document.getElementById('errorMsg').textContent = 'Koi video URL nahi mila.';
    }
  </script>
</body>
</html>
