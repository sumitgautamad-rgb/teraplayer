<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TeraBox Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #player-wrap {
      width: 100%;
      max-width: 900px;
      background: #111;
    }

    video {
      width: 100%;
      max-height: 60vh;
      background: #000;
      display: block;
    }

    #info {
      padding: 12px 16px;
      background: #111;
    }

    #title {
      font-size: 15px;
      font-weight: 600;
      color: #eee;
      word-break: break-word;
      margin-bottom: 6px;
    }

    #meta {
      font-size: 12px;
      color: #888;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    #meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #loading {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 16px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #333;
      border-top-color: #4a9eff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loading p {
      color: #aaa;
      font-size: 14px;
    }

    #error-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
      gap: 12px;
    }

    #error-screen .icon { font-size: 48px; }
    #error-screen h2 { font-size: 18px; color: #ff5555; }
    #error-screen p { font-size: 13px; color: #aaa; max-width: 300px; }

    .retry-btn {
      background: #4a9eff;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
    }

    .retry-btn:hover { background: #3a8eef; }

    #badge {
      background: #1a1a2e;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 8px 12px;
      margin: 10px 16px;
      font-size: 11px;
      color: #555;
      text-align: center;
    }
  </style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="spinner"></div>
  <p id="loading-text">Video load ho raha hai...</p>
</div>

<!-- Error -->
<div id="error-screen">
  <div class="icon">⚠️</div>
  <h2>Video nahi chala</h2>
  <p id="error-msg">Stream URL invalid ya expire ho gayi. Bot se dobara link request karein.</p>
  <button class="retry-btn" onclick="location.reload()">🔄 Retry</button>
</div>

<!-- Player -->
<div id="player-wrap" style="display:none">
  <video id="video" controls playsinline autoplay></video>
  <div id="info">
    <div id="title">TeraBox Video</div>
    <div id="meta">
      <span id="size-el"></span>
    </div>
  </div>
  <div id="badge">🛡️ Ad-Free Player &nbsp;•&nbsp; TeraBox Bot</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const streamUrl = params.get('v') || '';
  const title = params.get('title') || 'TeraBox Video';
  const size = params.get('size') || '';

  const loadingEl = document.getElementById('loading');
  const loadingText = document.getElementById('loading-text');
  const playerWrap = document.getElementById('player-wrap');
  const errorScreen = document.getElementById('error-screen');
  const errorMsg = document.getElementById('error-msg');
  const video = document.getElementById('video');
  const titleEl = document.getElementById('title');
  const sizeEl = document.getElementById('size-el');

  titleEl.textContent = decodeURIComponent(title);
  if (size) sizeEl.innerHTML = '📦 ' + decodeURIComponent(size);

  function showError(msg) {
    loadingEl.style.display = 'none';
    playerWrap.style.display = 'none';
    errorScreen.style.display = 'flex';
    if (msg) errorMsg.textContent = msg;
  }

  function showPlayer() {
    loadingEl.style.display = 'none';
    playerWrap.style.display = 'block';
    errorScreen.style.display = 'none';
  }

  if (!streamUrl) {
    showError('Stream URL nahi mila. Bot se dobara link request karein.');
  } else {
    const isHLS = streamUrl.includes('.m3u8') || streamUrl.includes('fast_stream');

    if (isHLS && Hls.isSupported()) {
      loadingText.textContent = 'HLS stream connect ho raha hai...';

      const hls = new Hls({
        enableWorker: true,
        lowLatencyMode: false,
        backBufferLength: 60,
        maxLoadingDelay: 20,
        startLevel: -1,
      });

      hls.loadSource(streamUrl);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        loadingText.textContent = 'Ready! Play ho raha hai...';
        showPlayer();
        video.play().catch(() => {});
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              loadingText.textContent = 'Network error, retry kar raha hai...';
              hls.startLoad();
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              hls.recoverMediaError();
              break;
            default:
              showError('Stream load nahi hui. Bot se dobara link mangein.');
              break;
          }
        }
      });

    } else if (isHLS && video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = streamUrl;
      video.addEventListener('loadedmetadata', () => { showPlayer(); video.play().catch(() => {}); });
      video.addEventListener('error', () => showError('Video load nahi hui.'));

    } else {
      loadingText.textContent = 'Video load ho raha hai...';
      video.src = streamUrl;
      video.addEventListener('loadedmetadata', () => { showPlayer(); video.play().catch(() => {}); });
      video.addEventListener('canplay', () => showPlayer());
      video.addEventListener('error', () => {
        showError('Video play nahi hui. Link expire ho gayi ho sakti hai.');
      });
    }
  }

  document.addEventListener('keydown', (e) => {
    switch(e.key) {
      case ' ':
      case 'k':
        e.preventDefault();
        video.paused ? video.play() : video.pause();
        break;
      case 'ArrowRight': video.currentTime += 10; break;
      case 'ArrowLeft':  video.currentTime -= 10; break;
      case 'ArrowUp':    video.volume = Math.min(1, video.volume + 0.1); break;
      case 'ArrowDown':  video.volume = Math.max(0, video.volume - 0.1); break;
      case 'f': if (video.requestFullscreen) video.requestFullscreen(); break;
    }
  });
</script>
</body>
</html>
