<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TeraBox Video Player</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0b0e14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #player-wrap {
      width: 100%;
      background: #000;
      position: relative;
    }
    
    /* Video player container */
    .video-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 70vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    iframe#player-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }
    
    .meta-box {
      padding: 14px 16px;
      background: #141822;
      border-bottom: 1px solid #1f2637;
    }
    .video-title {
      font-size: 15px;
      font-weight: 600;
      color: #f1f5f9;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .video-sub {
      display: flex;
      gap: 12px;
      margin-top: 6px;
      font-size: 12px;
      color: #94a3b8;
    }
    
    /* Ad Container */
    .ad-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 0;
      background: #0b0e14;
      min-height: 260px;
    }
    
    .ad-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #475569;
      margin-bottom: 6px;
    }

    /* Fallback / External Action */
    .action-row {
      padding: 10px 16px;
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
      border: none;
    }
    .btn:active {
      opacity: 0.85;
    }

    /* Loading Spinner */
    .loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0b0e14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      border-top-color: #3b82f6;
      animation: spin 0.8s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 14px;
      font-size: 13px;
      color: #94a3b8;
    }
    
    .error-box {
      display: none;
      padding: 30px 20px;
      text-align: center;
      flex-direction: column;
      align-items: center;
    }
    .error-icon {
      font-size: 36px;
      margin-bottom: 12px;
    }
    .error-title {
      font-size: 16px;
      font-weight: 600;
      color: #ef4444;
      margin-bottom: 6px;
    }
    .error-desc {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
    }
  </style>

  <!-- HLS.js for m3u8 playback -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
  <!-- Fluid Player for rich UI and pre-roll ads -->
  <script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>
</head>
<body>

  <!-- Loading Screen -->
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Video player load ho raha hai...</div>
  </div>

  <!-- Error Screen -->
  <div class="error-box" id="error-screen">
    <div class="error-icon">⚠️</div>
    <div class="error-title">Video Load Nahi Ho Payi</div>
    <div class="error-desc" id="error-msg">TeraBox link ko refresh karke dobara koshish karein.</div>
  </div>

  <!-- Player Screen -->
  <div id="player-wrap" style="display:none">
    <div class="video-container">
      <!-- Native Video (used when stream_url is present) -->
      <video id="video" playsinline controls style="display:none">
        <source id="video-source" src="" type="video/mp4">
      </video>
      <!-- Official Embed Player (Clean & Ad-free embed) -->
      <iframe id="player-frame" style="display:none" allowfullscreen allow="autoplay; fullscreen; encrypted-media"></iframe>
    </div>

    <!-- Video Metadata -->
    <div class="meta-box">
      <div class="video-title" id="title">TeraBox Video</div>
      <div class="video-sub">
        <span id="size-el"></span>
      </div>
    </div>

    <!-- Browser Action Button -->
    <div class="action-row" id="action-row" style="display:none">
      <a id="external-link" href="#" target="_blank" class="btn">
        🌐 Browser mein Fullscreen kholein
      </a>
    </div>

    <!-- Adsterra 300x250 Banner Ad -->
    <div class="ad-container">
      <div class="ad-label">Advertisement</div>
      <script type="text/javascript">
        atOptions = {
          'key' : 'd1bbf399e2fc66ea593e0d1a7d12903b',
          'format' : 'iframe',
          'height' : 250,
          'width' : 300,
          'params' : {}
        };
      </script>
      <script type="text/javascript" src="https://www.highrevenueformat.com/d1bbf399e2fc66ea593e0d1a7d12903b/invoke.js"></script>
    </div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const streamUrl = params.get('v') || '';
  const teraboxUrl = params.get('url') || '';
  const title = params.get('title') || 'TeraBox Video';
  const size = params.get('size') || '';

  const loadingEl = document.getElementById('loading');
  const playerWrap = document.getElementById('player-wrap');
  const errorScreen = document.getElementById('error-screen');
  const errorMsg = document.getElementById('error-msg');
  const video = document.getElementById('video');
  const videoSource = document.getElementById('video-source');
  const playerFrame = document.getElementById('player-frame');
  const titleEl = document.getElementById('title');
  const sizeEl = document.getElementById('size-el');
  const actionRow = document.getElementById('action-row');
  const externalLink = document.getElementById('external-link');

  titleEl.textContent = decodeURIComponent(title);
  if (size) sizeEl.innerHTML = '📦 ' + decodeURIComponent(size);

  function showError(msg) {
    loadingEl.style.display = 'none';
    playerWrap.style.display = 'none';
    errorScreen.style.display = 'flex';
    if (msg) errorMsg.textContent = msg;
  }

  function showPlayer() {
    loadingEl.style.display = 'none';
    playerWrap.style.display = 'block';
    errorScreen.style.display = 'none';
  }

  if (streamUrl) {
    // Mode 1: Direct stream URL available
    showPlayer();
    video.style.display = 'block';

    const isHLS = streamUrl.includes('.m3u8') || streamUrl.includes('fast_stream');
    videoSource.src = streamUrl;
    videoSource.type = isHLS ? 'application/x-mpegURL' : 'video/mp4';

    try {
      fluidPlayer('video', {
        layoutControls: {
          controlBar: {
            autoHide: true,
            playbackRates: ['x2', 'x1.5', 'x1', 'x0.5']
          },
          fillToContainer: true,
          autoPlay: true,
          mute: false,
          primaryColor: '#4a9eff'
        },
        vastOptions: {
          adList: [
            {
              roll: 'preRoll',
              vastTag: 'https://s.magsrv.com/v1/vast.php?idz=6044670',
              adText: 'Advertisement',
              adClickable: true
            }
          ],
          skipButtonCaption: 'Skip in [seconds]s',
          skipButtonClickCaption: 'Skip Ad ❯',
          adText: 'Advertisement'
        }
      });
    } catch (e) {
      console.warn('Fluid player fallback:', e);
      if (isHLS && Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      } else {
        video.src = streamUrl;
        video.play().catch(() => {});
      }
    }
  } else if (teraboxUrl || params.get('surl')) {
    // Mode 2: Clean Official Video Player (NO 3rd-party download site!)
    let surl = params.get('surl') || '';
    if (!surl && teraboxUrl) {
      const parts = teraboxUrl.split('?')[0].split('/');
      let code = parts[parts.length - 1];
      if (code.startsWith('1') && code.length > 10) {
        code = code.substring(1);
      }
      surl = code;
    }
    showPlayer();
    const embedUrl = 'https://www.1024tera.com/sharing/embed?surl=' + encodeURIComponent(surl);
    playerFrame.src = embedUrl;
    playerFrame.style.display = 'block';
    if (externalLink) externalLink.href = embedUrl;
    if (actionRow) actionRow.style.display = 'flex';
  } else {
    showError('Koi video link nahi mila. Bot se dobara TeraBox link bhejein.');
  }
</script>

<!-- Adsterra Social Bar Ad -->
<script src="https://pl31605317.profitableratecpmnetwork.com/9f/8d/f7/9f8df7edd6601a02ad831cbe92e0fba6.js"></script>

</body>
</html>
