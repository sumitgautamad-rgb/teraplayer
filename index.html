<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="6a97888e-site-verification" content="9e860b0b2e574fba417475ae567dc028" />
  <title>TeraBox Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #player-wrap {
      width: 100%;
      max-width: 900px;
      background: #111;
    }

    .video-container {
      width: 100%;
      position: relative;
      background: #000;
    }

    video {
      width: 100%;
      max-height: 60vh;
      background: #000;
      display: block;
    }

    #info {
      padding: 12px 16px;
      background: #111;
    }

    #title {
      font-size: 15px;
      font-weight: 600;
      color: #eee;
      word-break: break-word;
      margin-bottom: 6px;
    }

    #meta {
      font-size: 12px;
      color: #888;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    #meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Ad Container under video */
    #ad-box {
      margin: 15px auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 250px;
      background: #141414;
      border-radius: 8px;
      padding: 10px;
      max-width: 320px;
    }

    .ad-label {
      font-size: 10px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    #loading {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 16px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #333;
      border-top-color: #4a9eff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loading p {
      color: #aaa;
      font-size: 14px;
    }

    #error-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
      gap: 12px;
    }

    #error-screen .icon { font-size: 48px; }
    #error-screen h2 { font-size: 18px; color: #ff5555; }
    #error-screen p { font-size: 13px; color: #aaa; max-width: 300px; }

    .retry-btn {
      background: #4a9eff;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
    }

    .retry-btn:hover { background: #3a8eef; }

    #badge {
      background: #1a1a2e;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 8px 12px;
      margin: 10px 16px 20px;
      font-size: 11px;
      color: #777;
      text-align: center;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
  <script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="spinner"></div>
  <p id="loading-text">Video load ho raha hai...</p>
</div>

<!-- Error -->
<div id="error-screen">
  <div class="icon">⚠️</div>
  <h2>Video nahi chala</h2>
  <p id="error-msg">Stream URL invalid ya expire ho gayi. Bot se dobara link request karein.</p>
  <button class="retry-btn" onclick="location.reload()">🔄 Retry</button>
</div>

<!-- Player -->
<div id="player-wrap" style="display:none">
  <div class="video-container">
    <video id="video" playsinline controls autoplay>
      <source id="video-source" src="" type="application/x-mpegURL" />
    </video>
  </div>

  <div id="info">
    <div id="title">TeraBox Video</div>
    <div id="meta">
      <span id="size-el"></span>
    </div>
  </div>

  <!-- Permanent Banner Ad (Adsterra 300x250) -->
  <div id="ad-box">
    <div class="ad-label">Advertisement</div>
    <script type="text/javascript">
      atOptions = {
        'key' : 'd1bbf399e2fc66ea593e0d1a7d129019',
        'format' : 'iframe',
        'height' : 250,
        'width' : 300,
        'params' : {}
      };
    </script>
    <script type="text/javascript" src="https://www.highrevenueformat.com/d1bbf399e2fc66ea593e0d1a7d129019/invoke.js"></script>
  </div>

  <div id="badge">⚡ TeraBox Fast Video Player</div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const streamUrl = params.get('v') || '';
  const title = params.get('title') || 'TeraBox Video';
  const size = params.get('size') || '';

  const loadingEl = document.getElementById('loading');
  const playerWrap = document.getElementById('player-wrap');
  const errorScreen = document.getElementById('error-screen');
  const errorMsg = document.getElementById('error-msg');
  const video = document.getElementById('video');
  const videoSource = document.getElementById('video-source');
  const titleEl = document.getElementById('title');
  const sizeEl = document.getElementById('size-el');

  titleEl.textContent = decodeURIComponent(title);
  if (size) sizeEl.innerHTML = '📦 ' + decodeURIComponent(size);

  function showError(msg) {
    loadingEl.style.display = 'none';
    playerWrap.style.display = 'none';
    errorScreen.style.display = 'flex';
    if (msg) errorMsg.textContent = msg;
  }

  function showPlayer() {
    loadingEl.style.display = 'none';
    playerWrap.style.display = 'block';
    errorScreen.style.display = 'none';
  }

  if (!streamUrl) {
    showError('Stream URL nahi mila. Bot se dobara link request karein.');
  } else {
    showPlayer();

    const isHLS = streamUrl.includes('.m3u8') || streamUrl.includes('fast_stream');
    videoSource.src = streamUrl;
    videoSource.type = isHLS ? 'application/x-mpegURL' : 'video/mp4';

    try {
      fluidPlayer('video', {
        layoutControls: {
          controlBar: {
            autoHide: true,
            playbackRates: ['x2', 'x1.5', 'x1', 'x0.5']
          },
          fillToContainer: true,
          autoPlay: true,
          mute: false,
          primaryColor: '#4a9eff'
        },
        vastOptions: {
          adList: [
            {
              roll: 'preRoll',
              vastTag: 'https://s.magsrv.com/v1/vast.php?idz=6044670',
              adText: 'Advertisement',
              adClickable: true
            }
          ],
          skipButtonCaption: 'Skip in [seconds]s',
          skipButtonClickCaption: 'Skip Ad ❯',
          adText: 'Advertisement'
        }
      });
    } catch (e) {
      console.warn('Fluid player fallback:', e);
      if (isHLS && Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      } else {
        video.src = streamUrl;
        video.play().catch(() => {});
      }
    }
  }
</script>
</body>
</html>
